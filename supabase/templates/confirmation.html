<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirma tu cuenta VIAO</title>
  </head>
  <body style="margin:0;padding:0;background-color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#ffffff;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" style="max-width:480px;">
            <tr>
              <td style="padding-bottom:24px;">
                <span style="font-size:20px;font-weight:700;color:#171717;letter-spacing:-0.02em;">VIAO</span>
              </td>
            </tr>
            <tr>
              <td style="background-color:#ffffff;border:1px solid #e5e7eb;border-radius:12px;padding:32px;">
                <table role="presentation" width="100%">
                  <tr><td style="font-size:20px;font-weight:600;color:#171717;padding-bottom:12px;">Confirma tu cuenta</td></tr>
                  <tr>
                    <td style="font-size:15px;line-height:1.6;color:#171717;">
                      <p style="margin:0 0 12px;">Confirma tu email para empezar a usar VIAO.</p>
                      <p style="margin:0;">Tu actividad empieza a contar en cuanto confirmes tu cuenta.</p>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding-top:24px;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;background-color:#171717;color:#ffffff;text-decoration:none;font-weight:600;font-size:14px;padding:12px 20px;border-radius:8px;">Confirmar mi cuenta</a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding-top:24px;">
                <p style="margin:0;font-size:12px;color:#6b7280;">VIAO — Si no creaste esta cuenta, puedes ignorar este email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
